server:
  port: ${SERVER_PORT:8000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}

spring:
  cloud:
    gateway:
      routes: []

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls: []
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
