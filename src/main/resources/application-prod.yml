server:
  port: ${SERVER_PORT:8000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery:8761/eureka}

spring:
  cloud:
    gateway:
      routes: []
      server:
        webflux:
          trusted-proxies: "10\\..*|192\\.168\\..*|172\\.(1[6-9]|2[0-9]|3[0-1])\\..*"
          x-forwarded:
            proto-append: false

logging:
  level:
    root: WARN
    org.springframework.cloud.gateway: WARN
