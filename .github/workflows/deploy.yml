name: Deploy

on:
  push:
    branches:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test
          cp "$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' | head -1)" application.jar

      - name: Prepare deploy directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sudo mkdir -p /opt/msa/gateway
            sudo rm -rf /opt/msa/gateway/src /opt/msa/gateway/gradle /opt/msa/gateway/.gradle
            sudo chown -R ec2-user:ec2-user /opt/msa
            sudo docker network create msa_msa-network 2>/dev/null || true

      - name: Upload artifacts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "Dockerfile,docker-compose.yml,application.jar"
          target: /opt/msa/gateway
          strip_components: 0

      - name: Build and start container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/msa/gateway
            sudo docker builder prune -af || true
            sudo docker image prune -af || true
            sudo docker stop gateway 2>/dev/null || true
            sudo docker rm gateway 2>/dev/null || true
            sudo docker compose down 2>/dev/null || true
            sudo docker compose build gateway
            sudo docker compose up -d gateway
            sleep 45
            sudo docker ps -a --filter name=gateway
            sudo docker logs gateway --tail 100
            curl -sf http://localhost:8000/health
